<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stories Admin</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6efe4;
        --paper: #fffaf1;
        --ink: #242018;
        --muted: #73685c;
        --line: #e3d4c1;
        --accent: #285f68;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
      }

      .admin-login {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 1.5rem;
      }

      .admin-login__panel {
        width: min(100%, 26rem);
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
        box-shadow: 0 18px 45px rgba(69, 50, 31, 0.08);
        padding: 2rem;
      }

      .admin-login h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 2rem;
        font-weight: 500;
      }

      .admin-login p {
        margin: 0.85rem 0 1.35rem;
        color: var(--muted);
        line-height: 1.55;
      }

      .admin-login button {
        width: 100%;
        border: 0;
        border-radius: 999px;
        background: var(--accent);
        color: #fffaf1;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        padding: 0.75rem 1rem;
      }

      .admin-login button:hover {
        background: #183f46;
      }
    </style>
  </head>
  <body>
    <main class="admin-login" id="admin-login">
      <section class="admin-login__panel" aria-labelledby="admin-login-title">
        <h1 id="admin-login-title">Stories Admin</h1>
        <p>Log in with your Netlify Identity email and password to edit stories.</p>
        <button type="button" id="admin-login-button">Log in</button>
      </section>
    </main>
    <script>
      const loginPanel = document.getElementById('admin-login');
      const loginButton = document.getElementById('admin-login-button');

      if (window.netlifyIdentity) {
        window.netlifyIdentity.on('init', (user) => {
          if (user && loginPanel) {
            loginPanel.hidden = true;
          }
        });

        window.netlifyIdentity.on('login', () => {
          if (loginPanel) {
            loginPanel.hidden = true;
          }
          window.location.reload();
        });

        loginButton?.addEventListener('click', () => {
          window.netlifyIdentity.open('login');
        });

        if (window.location.hash.includes('_token=')) {
          window.netlifyIdentity.open();
        }
      }
    </script>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  </body>
</html>
